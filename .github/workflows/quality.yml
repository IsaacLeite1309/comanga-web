name: Frontend Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  frontend:
    name: Vitest coverage, ESLint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend coverage threshold
        run: npm run test:coverage

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
